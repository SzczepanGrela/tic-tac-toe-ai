<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="meta-description" name="description" content="Play and compare Tic-Tac-Toe agents on 3×3, 5×5 and 9×9 boards.">
  <title>Tic-Tac-Toe AI Lab</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/AtkinsonHyperlegible-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <div class="site-intro">
        <h1>Tic-Tac-Toe</h1>
        <p class="lede" data-i18n="lede">Play against a model, share the board, or watch two agents compete.</p>
      </div>
      <div class="preferences" aria-label="Preferences" data-i18n-aria="preferences">
        <div class="language-switch" aria-label="Language" data-i18n-aria="language">
          <button id="lang-en" type="button" data-language="en" aria-pressed="true">EN</button>
          <button id="lang-pl" type="button" data-language="pl" aria-pressed="false">PL</button>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <span data-i18n="darkTheme">Dark</span>
        </button>
      </div>
    </header>

    <section class="lab-card" aria-label="Game" data-i18n-aria="game">
      <nav class="mode-tabs" aria-label="Game mode" data-i18n-aria="gameMode">
        <button type="button" data-mode="human" class="active" aria-pressed="true" data-i18n="humanVsAi">Human vs AI</button>
        <button type="button" data-mode="ai" aria-pressed="false" data-i18n="aiVsAi">AI vs AI</button>
        <button type="button" data-mode="local" aria-pressed="false" data-i18n="localPlayers">Local players</button>
        <span class="mode-pill" aria-hidden="true"></span>
      </nav>

      <div class="play-layout">
        <aside class="settings-panel">
          <button id="settings-toggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-body">
            <span data-i18n="settings">Game settings</span>
            <span id="settings-summary" class="settings-summary"></span>
            <span class="settings-chevron" aria-hidden="true"></span>
          </button>
          <div id="settings-body" class="settings-body">
            <div class="settings">
              <label><span data-i18n="boardSize">Board size</span><select id="board-size" disabled></select></label>
              <label><span data-i18n="winLength">Marks to win</span><select id="win-length" disabled></select></label>
              <label id="human-agent-field"><span data-i18n="opponent">Opponent</span><select id="human-agent"></select></label>
              <label class="ai-field"><span data-i18n="xAgent">X agent</span><select id="x-agent"></select></label>
              <label class="ai-field"><span data-i18n="oAgent">O agent</span><select id="o-agent"></select></label>
              <label class="ai-field"><span data-i18n="games">Games</span><select id="series-count"><option>1</option><option>3</option><option>5</option><option>10</option></select></label>
              <label class="ai-field"><span data-i18n="seed">Seed</span><input id="seed" inputmode="numeric" placeholder="random" data-i18n-placeholder="random"></label>
            </div>
            <details id="agent-availability" class="agent-availability hidden">
              <summary data-i18n="unavailableAgents">Why are some agents unavailable?</summary>
              <ul id="unavailable-agents"></ul>
            </details>
          </div>
        </aside>

        <div class="play-panel">
          <div id="status" class="status" role="status" aria-live="polite">Ready</div>
          <div class="board-scroll"><div id="board" class="board" role="group" aria-label="Tic-Tac-Toe board" data-i18n-aria="board"></div></div>
          <div class="game-actions">
            <button id="start" class="primary" type="button" data-i18n="newGame">New game</button>
            <div id="replay-controls" class="replay-controls hidden">
              <button id="pause" type="button" data-i18n="pause">Pause</button>
              <button id="step" type="button" data-i18n="step">Step</button>
              <button id="stop-series" type="button" class="hidden" data-i18n="stopSeries">Stop series</button>
              <label><span data-i18n="speed">Speed</span><select id="speed"><option value="1600">0.25×</option><option value="900">0.5×</option><option value="500" selected>1×</option><option value="250">2×</option><option value="125">4×</option></select></label>
            </div>
          </div>
          <div id="algorithm-note" class="algorithm-note"></div>
          <div id="scoreboard" class="scoreboard hidden">
            <div><strong id="x-wins">0</strong><span data-i18n="xWins">X wins</span></div>
            <div><strong id="draws">0</strong><span data-i18n="draws">Draws</span></div>
            <div><strong id="o-wins">0</strong><span data-i18n="oWins">O wins</span></div>
            <p id="series-meta"></p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
