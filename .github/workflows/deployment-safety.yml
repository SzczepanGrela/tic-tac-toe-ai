name: Validate deployment safety

on:
  workflow_dispatch:
    inputs:
      canary_application_uuid:
        description: Isolated no-domain Coolify application UUID
        required: true
        default: j9l8ujnosbiw94dzgugakyj7
        type: string
      stable_digest:
        description: Current immutable digest of the isolated application
        required: true
        default: sha256:4f037faec3a8a56a833ae00fb28f426851736a7dcf35a9c3ad5238b5821b865f
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/szczepangrela/tic-tac-toe-ai

jobs:
  validate:
    name: Isolated cancellation and restoration
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      attestations: read
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require the protected main workflow
        env:
          CANARY_APPLICATION_UUID: ${{ inputs.canary_application_uuid }}
          PRODUCTION_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          STABLE_DIGEST: ${{ inputs.stable_digest }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$CANARY_APPLICATION_UUID"
          test -n "$PRODUCTION_APPLICATION_UUID"
          test "$CANARY_APPLICATION_UUID" != "$PRODUCTION_APPLICATION_UUID"
          if [[ ! "$STABLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid stable digest." >&2
            exit 64
          fi
      - name: Verify the stable image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_DIGEST: ${{ inputs.stable_digest }}
        run: gh attestation verify "oci://${IMAGE_NAME}@${STABLE_DIGEST}" --repo "$GITHUB_REPOSITORY"
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-vps
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the deliberately nonhealthy candidate
        id: candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/Dockerfile.deployment-safety
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}@${{ inputs.stable_digest }}
          tags: ${{ env.IMAGE_NAME }}:deployment-safety-${{ github.run_id }}-${{ github.run_attempt }}
          push: true
          provenance: false
          sbom: false
      - name: Cancel the candidate and restore the canary
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          COOLIFY_APPLICATION_UUID: ${{ inputs.canary_application_uuid }}
          COOLIFY_PRODUCTION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          STABLE_DIGEST: ${{ inputs.stable_digest }}
        run: |
          python -m infra.coolify_safety_check \
            --coolify-url "$COOLIFY_URL" \
            --application-uuid "$COOLIFY_APPLICATION_UUID" \
            --production-application-uuid "$COOLIFY_PRODUCTION_UUID" \
            --stable-digest "$STABLE_DIGEST" \
            --candidate-digest "$CANDIDATE_DIGEST"
      - name: Remove the validation image from GHCR
        env:
          CANDIDATE_TAG: deployment-safety-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          package_name="${GITHUB_REPOSITORY#*/}"
          versions="$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}/versions?per_page=100")"
          version_id="$(jq -er --arg tag "$CANDIDATE_TAG" \
            'map(select(.metadata.container.tags | index($tag))) | if length == 1 then .[0].id else error("validation image version is not unique") end' \
            <<<"$versions")"
          gh api --method DELETE \
            "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}/versions/${version_id}"
