name: Deploy

on:
  workflow_call:
    inputs:
      digest:
        description: Immutable GHCR manifest digest
        required: true
        type: string
      expected_revision:
        description: Commit expected in the image revision label
        required: true
        type: string
      rollback_validation:
        description: Trigger the reviewed public-smoke rollback validation
        required: false
        default: false
        type: boolean
      expected_previous_digest:
        description: Exact production digest required before rollback validation
        required: false
        default: ""
        type: string
      expected_previous_revision:
        description: Exact production revision required before rollback validation
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      digest:
        description: "Previously attested digest (sha256:...)"
        required: true
        type: string
      expected_revision:
        description: "Optional full commit SHA; leave empty to use the image label"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/szczepangrela/tic-tac-toe-ai

jobs:
  preflight:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    outputs:
      deploy: ${{ steps.freshness.outputs.deploy }}
      revision: ${{ steps.image.outputs.revision }}
    steps:
      - name: Validate immutable digest
        env:
          DIGEST: ${{ inputs.digest }}
          EXPECTED_PREVIOUS_DIGEST: ${{ inputs.expected_previous_digest }}
          EXPECTED_PREVIOUS_REVISION: ${{ inputs.expected_previous_revision }}
          ROLLBACK_VALIDATION: ${{ inputs.rollback_validation }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest." >&2
            exit 64
          fi
          if [[ "$ROLLBACK_VALIDATION" == true ]]; then
            if [[ ! "$EXPECTED_PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid expected previous digest." >&2
              exit 64
            fi
            if [[ ! "$EXPECTED_PREVIOUS_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid expected previous revision." >&2
              exit 64
            fi
            if [[ "$DIGEST" == "$EXPECTED_PREVIOUS_DIGEST" ]]; then
              echo "Rollback validation requires a new target digest." >&2
              exit 64
            fi
          fi
      - name: Verify GitHub artifact attestation
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
      - name: Read and verify image revision
        id: image
        env:
          DIGEST: ${{ inputs.digest }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          docker pull "${IMAGE_NAME}@${DIGEST}" >/dev/null
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_NAME}@${DIGEST}")"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Image has no valid revision label." >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_REVISION" && "$revision" != "$EXPECTED_REVISION" ]]; then
            echo "Image revision does not match the caller commit." >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Reject a stale automatic deployment
        id: freshness
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy=true
          if [[ -n "$EXPECTED_REVISION" ]]; then
            main_revision="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [[ "$main_revision" != "$EXPECTED_REVISION" ]]; then
              echo "Skipping stale deployment for $EXPECTED_REVISION; main is $main_revision."
              deploy=false
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    name: Production
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-vps
      - name: Validate production configuration
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          for value in \
            "$COOLIFY_URL" \
            "$COOLIFY_APPLICATION_UUID" \
            "$PRODUCTION_URL" \
            "$COOLIFY_TOKEN"; do
            test -n "$value"
          done
      - name: Deploy through Coolify and verify production
        env:
          DIGEST: ${{ inputs.digest }}
          EXPECTED_REVISION: ${{ needs.preflight.outputs.revision }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          ROLLBACK_VALIDATION: ${{ inputs.rollback_validation }}
          EXPECTED_PREVIOUS_DIGEST: ${{ inputs.expected_previous_digest }}
          EXPECTED_PREVIOUS_REVISION: ${{ inputs.expected_previous_revision }}
        run: |
          validation_args=()
          if [[ "$ROLLBACK_VALIDATION" == true ]]; then
            validation_args=(
              --rollback-validation-confirmation restore-after-controlled-public-smoke-failure
              --expected-previous-digest "$EXPECTED_PREVIOUS_DIGEST"
              --expected-previous-revision "$EXPECTED_PREVIOUS_REVISION"
            )
          fi
          python -m infra.coolify_release \
            --coolify-url "$COOLIFY_URL" \
            --application-uuid "$COOLIFY_APPLICATION_UUID" \
            --public-url "$PRODUCTION_URL" \
            --digest "$DIGEST" \
            --expected-revision "$EXPECTED_REVISION" \
            "${validation_args[@]}"
