name: Deploy

on:
  workflow_call:
    inputs:
      digest:
        description: Immutable GHCR manifest digest
        required: true
        type: string
      expected_revision:
        description: Commit expected in the image revision label
        required: true
        type: string
  workflow_dispatch:
    inputs:
      digest:
        description: "Previously attested digest (sha256:...)"
        required: true
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/szczepangrela/tic-tac-toe-ai

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - name: Validate immutable digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest." >&2
            exit 64
          fi
      - name: Verify GitHub artifact attestation
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
      - name: Read and verify image revision
        id: image
        env:
          DIGEST: ${{ inputs.digest }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          docker pull "${IMAGE_NAME}@${DIGEST}" >/dev/null
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_NAME}@${DIGEST}")"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Image has no valid revision label." >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_REVISION" && "$revision" != "$EXPECTED_REVISION" ]]; then
            echo "Image revision does not match the caller commit." >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Reject a stale automatic deployment
        id: freshness
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy=true
          if [[ -n "$EXPECTED_REVISION" ]]; then
            main_revision="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [[ "$main_revision" != "$EXPECTED_REVISION" ]]; then
              echo "Skipping stale deployment for $EXPECTED_REVISION; main is $main_revision."
              deploy=false
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Connect to Tailscale
        if: steps.freshness.outputs.deploy == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-vps
      - name: Configure pinned SSH host identity
        if: steps.freshness.outputs.deploy == 'true'
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/deploy_key
          test -s ~/.ssh/known_hosts
      - name: Deploy and verify exact digest
        if: steps.freshness.outputs.deploy == 'true'
        env:
          DIGEST: ${{ inputs.digest }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$SSH_USER@$SSH_HOST" \
            "deploy $DIGEST"
