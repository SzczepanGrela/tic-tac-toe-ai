name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/szczepangrela/tic-tac-toe-ai

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: python -m pip install -r requirements-web.txt pytest pytest-cov httpx
      - run: python -m compileall -q ai game training web infra
      - run: >-
          python -m pytest --ignore=tests/test_e2e.py
          --cov=ai --cov=game --cov=web --cov-report=term-missing

  training-smoke:
    name: Training smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - run: python -m pip install -r requirements-training.txt
      - run: python -m training train --agent q_learning --preset smoke --seeds 42
      - run: python -m training train --agent dqn --preset smoke --seeds 42
      - run: python -m training train --agent imitation --preset smoke --seeds 42
      - run: python -m training train --agent reinforce --preset smoke --seeds 42

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: python -m pip install -r requirements-web.txt pytest pytest-playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_e2e.py
        env:
          RUN_E2E: "1"

  container:
    name: Container
    needs: [test, training-smoke, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the tested image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          build-args: RELEASE_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          provenance: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Select the exact tested image
        id: tested-image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "ref=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke-test the exact image
        env:
          IMAGE_REF: ${{ steps.tested-image.outputs.ref }}
        run: |
          container_name="tic-tac-toe-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --cap-drop ALL \
            --init \
            --cpus 1 \
            --memory 512m \
            --memory-reservation 128m \
            --memory-swap 512m \
            "$IMAGE_REF" >/dev/null

          health=starting
          for _ in {1..60}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [[ "$health" == healthy ]]; then
              break
            fi
            if [[ "$health" == unhealthy ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$health" != healthy ]]; then
            docker logs "$container_name"
            echo "Container health status is $health." >&2
            exit 1
          fi

          docker exec "$container_name" \
            python -m web.smokecheck --expected-revision "$GITHUB_SHA"
      - name: Scan fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tested-image.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Attest the published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  quality-gate:
    name: Quality gate
    if: always()
    needs: [test, training-smoke, browser, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TRAINING_RESULT: ${{ needs.training-smoke.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          for result in "$TEST_RESULT" "$TRAINING_RESULT" "$BROWSER_RESULT" "$CONTAINER_RESULT"; do
            test "$result" = success
          done

  deploy:
    name: Deploy tested digest
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [container, quality-gate]
    permissions:
      attestations: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      digest: ${{ needs.container.outputs.digest }}
      expected_revision: ${{ github.sha }}
